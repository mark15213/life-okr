# XcodeGen spec. Run `xcodegen generate` in this folder, then open Hustle.xcodeproj.
name: Hustle
options:
  bundleIdPrefix: app.hustle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # fill in your Apple team id, or pick it in Xcode > Signing
targets:
  Hustle:
    type: application
    platform: iOS
    sources:
      - path: Hustle
      - path: Shared
    info:
      path: Hustle/Info.plist
      properties:
        CFBundleDisplayName: Hustle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hustle.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HustleWidgets
        embed: true
        codeSign: true
  HustleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HustleWidgets
      - path: Shared
    info:
      path: HustleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hustle Focus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hustle.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HustleWidgets/HustleWidgets.entitlements
      properties: {}
